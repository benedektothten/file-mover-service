name: Build and Release Installer

on:
  push:
    branches:
      - release/*

jobs:
  build:
    name: Build FileMoverService Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          $branch = "${{ github.ref_name }}"
          $version = $branch -replace '^release/', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore and Publish Project
        run: dotnet restore && dotnet publish -c Release -r win-x64 --self-contained true -o publish /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Install Inno Setup
        run: |
          curl -L -o innosetup.exe https://jrsoftware.org/download.php/is.exe
          ./innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion="${{ steps.version.outputs.VERSION }}" `
            FileMoverService.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: Output/FileMoverServiceInstaller.exe
